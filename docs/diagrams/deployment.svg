<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#f4f7fb"/>
  <rect x="0" y="0" width="1100" height="64" fill="#101820"/>
  <text x="32" y="40" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="22">What ran, and what stayed shut</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="36" y="100" width="500" height="300" rx="12" fill="#ffffff" stroke="#1f7a4d"/>
    <text x="56" y="136" fill="#1f7a4d" font-size="16">Ran on this workstation</text>
    <text x="56" y="172" fill="#102033" font-size="14">Python 3.12 lab store and pytest</text>
    <text x="56" y="198" fill="#102033" font-size="14">dbt build on local DuckDB</text>
    <text x="56" y="224" fill="#102033" font-size="14">React workbench build</text>
    <text x="56" y="250" fill="#102033" font-size="14">40 repeated draft timings</text>
    <text x="56" y="276" fill="#102033" font-size="14">40 repeated SQL lookups</text>
    <text x="56" y="320" fill="#5c6b7a" font-size="13">Price was not applied. Tokens stayed 0.</text>
    <text x="56" y="360" fill="#5c6b7a" font-size="13">Postgres was not started here.</text>
    <rect x="564" y="100" width="500" height="300" rx="12" fill="#ffffff" stroke="#9b2c2c"/>
    <text x="584" y="136" fill="#9b2c2c" font-size="16">Not run</text>
    <text x="584" y="172" fill="#102033" font-size="14">Docker and kubectl</text>
    <text x="584" y="198" fill="#102033" font-size="14">Airflow scheduler</text>
    <text x="584" y="224" fill="#102033" font-size="14">Terraform and EKS</text>
    <text x="584" y="250" fill="#102033" font-size="14">Hosted model and warehouse</text>
    <text x="584" y="276" fill="#102033" font-size="14">Grafana import</text>
    <text x="584" y="320" fill="#5c6b7a" font-size="13">Deployment decision stays NO-GO.</text>
    <text x="584" y="360" fill="#5c6b7a" font-size="13">Image proof waits for Actions.</text>
  </g>
</svg>
